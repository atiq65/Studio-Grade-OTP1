<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTP Sender • Studio Auth UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
   <!-- Fonts name - Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #050811;
      /* Subtle studio dot-grid overlay */
      background-image: radial-gradient(rgba(148, 163, 184, 0.14) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .font-mono-code { font-family: 'JetBrains Mono', monospace; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .animate-shake { animation: shake 0.3s ease-in-out; }
  </style>
</head>
<body class="min-h-screen text-slate-100 flex items-center justify-center p-4 relative overflow-hidden">

  <!-- Ambient Violet, Indigo & Cyan Glows -->
  <div class="w-[28rem] h-[28rem] bg-indigo-600/20 rounded-full blur-3xl absolute -top-24 -left-24 pointer-events-none"></div>
  <div class="w-[26rem] h-[26rem] bg-cyan-500/10 rounded-full blur-3xl absolute -bottom-24 -right-24 pointer-events-none"></div>
  <div class="w-80 h-80 bg-violet-600/15 rounded-full blur-3xl absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none"></div>

  <!-- Top-Right Source Code Trigger -->
  <button type="button" onclick="openSourceModal()" class="fixed top-4 right-4 z-20 inline-flex items-center gap-1.5 px-3.5 py-2 rounded-full bg-slate-900/85 hover:bg-slate-800/95 border border-white/10 hover:border-indigo-400/50 text-xs font-medium text-slate-200 shadow-lg backdrop-blur-md transition cursor-pointer">
    <svg class="w-3.5 h-3.5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
    <span>Source Code</span>
  </button>

  <!-- Main Glassmorphic Auth Card -->
  <main class="w-full max-w-md rounded-3xl bg-slate-900/75 backdrop-blur-2xl border border-white/10 shadow-[0_24px_80px_rgba(0,0,0,0.65)] p-6 sm:p-8 relative z-10">

    <!-- Top Status Header -->
    <div class="flex items-center justify-between text-[11px] font-medium text-slate-400 pb-5 mb-6 border-b border-white/10">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.8)]"></span>
        <span class="tracking-wide text-slate-300">OTP Sender • Auth Flow</span>
      </div>
      <span class="px-2 py-0.5 rounded-md bg-white/5 border border-white/10 text-indigo-300">6-Digit</span>
    </div>

    <!-- STEP 1: Send OTP -->
    <form id="step1" onsubmit="handleSendOTP(event)" class="space-y-5">
      <div class="text-center space-y-1.5">
        <div class="w-12 h-12 mx-auto rounded-2xl bg-gradient-to-br from-indigo-500/20 to-cyan-500/20 border border-indigo-400/25 flex items-center justify-center text-indigo-300 mb-2">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"/></svg>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-white">Welcome Back</h1>
        <p class="text-xs sm:text-sm text-slate-400">Enter your phone or email to get a one-time code</p>
      </div>

      <!-- Phone / Email Segmented Switcher -->
      <div class="grid grid-cols-2 p-1 rounded-xl bg-slate-950/90 border border-white/10 text-xs font-semibold">
        <button type="button" id="tabPhone" onclick="switchMode('phone')" class="py-2 rounded-lg bg-indigo-500/20 text-indigo-200 border border-indigo-400/30 transition cursor-pointer">Phone</button>
        <button type="button" id="tabEmail" onclick="switchMode('email')" class="py-2 rounded-lg text-slate-400 hover:text-white border border-transparent transition cursor-pointer">Email</button>
      </div>

      <!-- Phone Input Group (Country Code + Number) -->
      <div id="phoneGroup" class="space-y-1.5">
        <label for="phoneInput" class="block text-xs font-medium text-slate-300">Mobile Number</label>
        <div class="flex gap-2">
          <select id="countryCode" aria-label="Country code" class="px-3 py-3 rounded-xl bg-slate-950/90 border border-white/10 focus:border-indigo-400 focus:outline-none text-xs sm:text-sm font-medium text-slate-200 transition cursor-pointer">
            <option value="+880">🇧🇩 +880</option>
            <option value="+1">🇺🇸 +1</option>
            <option value="+91">🇮🇳 +91</option>
            <option value="+60">🇲🇾 +60</option>
          </select>
          <input id="phoneInput" type="tel" required placeholder="1767 045665" class="flex-1 min-w-0 px-4 py-3 rounded-xl bg-slate-950/90 border border-white/10 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-500/20 focus:outline-none text-sm text-white placeholder-slate-500 transition" />
        </div>
      </div>

      <!-- Email Input Group -->
      <div id="emailGroup" class="hidden space-y-1.5">
        <label for="emailInput" class="block text-xs font-medium text-slate-300">Email Address</label>
        <input id="emailInput" type="email" placeholder="sheikhatiqhasan.com" class="w-full px-4 py-3 rounded-xl bg-slate-950/90 border border-white/10 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-500/20 focus:outline-none text-sm text-white placeholder-slate-500 transition" />
      </div>

      <!-- Primary Gradient CTA with Spinner -->
      <button id="sendBtn" type="submit" class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-indigo-500 via-violet-500 to-cyan-500 hover:brightness-110 text-white font-semibold text-sm shadow-lg shadow-indigo-500/25 flex items-center justify-center gap-2 transition active:scale-[0.99] cursor-pointer">
        <svg id="sendSpinner" class="hidden w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
        <span id="sendBtnText">Send OTP</span>
      </button>
    </form>

    <!-- STEP 2: Verify 6-Digit OTP -->
    <form id="step2" onsubmit="handleVerifyOTP(event)" class="hidden space-y-5">
      <div class="text-center space-y-1">
        <h2 class="text-xl font-bold text-white">Verify 6-Digit OTP</h2>
        <p class="text-xs text-slate-400">
          Code sent to <span id="recipientText" class="text-slate-200 font-semibold"></span>
          <button type="button" onclick="resetToStep1()" class="text-cyan-400 hover:underline font-medium ml-1 cursor-pointer">Change</button>
        </p>
      </div>

      <!-- 6 OTP Digit Boxes -->
      <div id="otpRow" class="grid grid-cols-6 gap-2">
        <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 1" class="otp-box h-12 text-center text-lg font-bold rounded-xl bg-slate-950/90 border border-white/10 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/25 focus:outline-none text-white transition" />
        <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2" class="otp-box h-12 text-center text-lg font-bold rounded-xl bg-slate-950/90 border border-white/10 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/25 focus:outline-none text-white transition" />
        <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3" class="otp-box h-12 text-center text-lg font-bold rounded-xl bg-slate-950/90 border border-white/10 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/25 focus:outline-none text-white transition" />
        <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4" class="otp-box h-12 text-center text-lg font-bold rounded-xl bg-slate-950/90 border border-white/10 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/25 focus:outline-none text-white transition" />
        <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5" class="otp-box h-12 text-center text-lg font-bold rounded-xl bg-slate-950/90 border border-white/10 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/25 focus:outline-none text-white transition" />
        <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6" class="otp-box h-12 text-center text-lg font-bold rounded-xl bg-slate-950/90 border border-white/10 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/25 focus:outline-none text-white transition" />
      </div>

      <p id="otpError" class="hidden text-center text-xs font-medium text-rose-400">Incorrect OTP. Try 123456 for demo.</p>

      <!-- Timer & Quick Demo Fill -->
      <div class="flex items-center justify-between text-xs">
        <div>
          <span id="timerLabel" class="text-slate-400">Resend in <strong id="secondsLeft" class="text-slate-200">30s</strong></span>
          <button type="button" id="resendAction" onclick="startCountdown()" class="hidden text-indigo-400 hover:underline font-medium cursor-pointer">Resend OTP</button>
        </div>
        <button type="button" onclick="fillDemoCode()" class="px-2.5 py-1 rounded-lg bg-indigo-500/15 hover:bg-indigo-500/25 border border-indigo-400/25 text-indigo-300 font-medium transition cursor-pointer">Fill 123456</button>
      </div>

      <button type="submit" class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-indigo-500 via-violet-500 to-cyan-500 hover:brightness-110 text-white font-semibold text-sm shadow-lg shadow-indigo-500/25 transition active:scale-[0.99] cursor-pointer">
        Verify & Continue
      </button>
    </form>

    <!-- STEP 3: Verified State -->
    <div id="step3" class="hidden text-center space-y-5 py-2">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-emerald-500/15 border border-emerald-400/30 text-emerald-400 flex items-center justify-center shadow-[0_0_25px_rgba(16,185,129,0.2)]">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" d="M5 13l4 4L19 7"/></svg>
      </div>
      <div class="space-y-1">
        <span class="inline-block px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-500/15 text-emerald-300 border border-emerald-400/25">Identity Verified</span>
        <h2 class="text-xl font-bold text-white pt-1">You're Signed In</h2>
        <p class="text-xs text-slate-400">Verified recipient: <span id="verifiedSummary" class="text-slate-200 font-medium"></span></p>
      </div>
      <button type="button" onclick="resetToStep1()" class="w-full py-3 rounded-xl bg-slate-800/90 hover:bg-slate-700 border border-white/10 text-xs font-semibold text-slate-200 transition cursor-pointer">
        Test Again
      </button>
    </div>

  </main>

  <!-- Source Code Modal -->
  <div id="codeModal" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4" onclick="closeSourceModal(event)">
    <div class="w-full max-w-2xl rounded-2xl bg-slate-900 border border-white/15 shadow-2xl overflow-hidden" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between px-4 py-3 bg-slate-950/80 border-b border-white/10">
        <span class="text-xs font-semibold text-slate-200">Complete Source Code (otp-login-ui.html)</span>
        <div class="flex items-center gap-2">
          <button type="button" id="copyCodeBtn" onclick="copyFullCode()" class="px-3 py-1 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-xs font-medium text-white transition cursor-pointer">Copy</button>
          <button type="button" onclick="closeSourceModal()" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 transition cursor-pointer">Close</button>
        </div>
      </div>
      <pre id="sourceCodeBlock" class="font-mono-code text-[11px] leading-relaxed text-slate-300 p-4 max-h-[65vh] overflow-auto bg-slate-950"></pre>
    </div>
  </div>

  <script>
    // Application state & DOM references
    let currentMode = 'phone';
    let currentRecipient = '';
    let countdownId = null;

    const otpBoxes = [...document.querySelectorAll('.otp-box')];
    const phoneInput = document.getElementById('phoneInput');
    const emailInput = document.getElementById('emailInput');

    function showStep(stepId) {
      ['step1', 'step2', 'step3'].forEach(id => {
        document.getElementById(id).classList.toggle('hidden', id !== stepId);
      });
    }

    // Switch cleanly between Phone (with country code) and Email modes
    function switchMode(mode) {
      currentMode = mode;
      const isPhone = mode === 'phone';
      document.getElementById('tabPhone').className = isPhone
        ? 'py-2 rounded-lg bg-indigo-500/20 text-indigo-200 border border-indigo-400/30 transition cursor-pointer'
        : 'py-2 rounded-lg text-slate-400 hover:text-white border border-transparent transition cursor-pointer';
      document.getElementById('tabEmail').className = !isPhone
        ? 'py-2 rounded-lg bg-indigo-500/20 text-indigo-200 border border-indigo-400/30 transition cursor-pointer'
        : 'py-2 rounded-lg text-slate-400 hover:text-white border border-transparent transition cursor-pointer';

      document.getElementById('phoneGroup').classList.toggle('hidden', !isPhone);
      document.getElementById('emailGroup').classList.toggle('hidden', isPhone);
      phoneInput.required = isPhone;
      emailInput.required = !isPhone;
    }

    // Start 30-second OTP resend countdown
    function startCountdown() {
      clearInterval(countdownId);
      let left = 30;
      document.getElementById('timerLabel').classList.remove('hidden');
      document.getElementById('resendAction').classList.add('hidden');
      document.getElementById('secondsLeft').textContent = `${left}s`;

      countdownId = setInterval(() => {
        left -= 1;
        document.getElementById('secondsLeft').textContent = `${left}s`;
        if (left <= 0) {
          clearInterval(countdownId);
          document.getElementById('timerLabel').classList.add('hidden');
          document.getElementById('resendAction').classList.remove('hidden');
        }
      }, 1000);
    }

    // Simulate sending OTP with brief loading spinner
    function handleSendOTP(e) {
      e.preventDefault();
      const code = document.getElementById('countryCode').value;
      currentRecipient = currentMode === 'phone'
        ? `${code} ${phoneInput.value.trim()}`
        : emailInput.value.trim();
      if (!currentRecipient) return;

      const btn = document.getElementById('sendBtn');
      const spinner = document.getElementById('sendSpinner');
      const btnText = document.getElementById('sendBtnText');
      btn.disabled = true;
      spinner.classList.remove('hidden');
      btnText.textContent = 'Sending OTP...';

      setTimeout(() => {
        btn.disabled = false;
        spinner.classList.add('hidden');
        btnText.textContent = 'Send OTP';
        document.getElementById('recipientText').textContent = currentRecipient;
        otpBoxes.forEach(box => { box.value = ''; });
        document.getElementById('otpError').classList.add('hidden');
        showStep('step2');
        startCountdown();
        otpBoxes[0].focus();
      }, 650);
    }

    // Auto-advance, backspace & clipboard paste for 6-digit OTP inputs
    otpBoxes.forEach((box, idx) => {
      box.addEventListener('input', () => {
        box.value = box.value.replace(/\D/g, '').slice(0, 1);
        if (box.value && idx < otpBoxes.length - 1) otpBoxes[idx + 1].focus();
      });
      box.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !box.value && idx > 0) otpBoxes[idx - 1].focus();
      });
      box.addEventListener('paste', (e) => {
        e.preventDefault();
        const digits = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 6);
        digits.split('').forEach((d, i) => { if (otpBoxes[i]) otpBoxes[i].value = d; });
        otpBoxes[Math.min(digits.length, 5)].focus();
      });
    });

    function fillDemoCode() {
      '123456'.split('').forEach((digit, i) => { otpBoxes[i].value = digit; });
      document.getElementById('otpError').classList.add('hidden');
      otpBoxes[5].focus();
    }

    // Validate entered 6-digit OTP (demo code: 123456)
    function handleVerifyOTP(e) {
      e.preventDefault();
      const entered = otpBoxes.map(b => b.value).join('');
      if (entered === '123456') {
        clearInterval(countdownId);
        document.getElementById('verifiedSummary').textContent = currentRecipient;
        return showStep('step3');
      }

      const row = document.getElementById('otpRow');
      const err = document.getElementById('otpError');
      err.classList.remove('hidden');
      row.classList.add('animate-shake');
      otpBoxes.forEach(b => { b.value = ''; b.classList.add('border-rose-500'); });
      otpBoxes[0].focus();

      setTimeout(() => {
        row.classList.remove('animate-shake');
        otpBoxes.forEach(b => b.classList.remove('border-rose-500'));
      }, 500);
    }

    function resetToStep1() {
      clearInterval(countdownId);
      otpBoxes.forEach(b => { b.value = ''; });
      document.getElementById('otpError').classList.add('hidden');
      showStep('step1');
    }

    // Source code modal helpers
    function openSourceModal() {
      document.getElementById('sourceCodeBlock').textContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      document.getElementById('codeModal').classList.remove('hidden');
    }

    function closeSourceModal() {
      document.getElementById('codeModal').classList.add('hidden');
    }

    function copyFullCode() {
      const codeText = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      const temp = document.createElement('textarea');
      temp.value = codeText;
      document.body.appendChild(temp);
      temp.select();
      try { document.execCommand('copy'); } catch (_) {}
      document.body.removeChild(temp);

      const btn = document.getElementById('copyCodeBtn');
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
    }
  </script>
</body>
</html>
